name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: python3 -m py_compile dictate.py

      - name: Install nfpm
        # 固定版本直接下載:查 releases/latest 的匿名 API 在共用 runner 上常被 rate limit
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm

      - name: Semantic release (builds RPM + DEB on new version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npm exec --yes
          --package semantic-release@24
          --package @semantic-release/exec@7
          -- semantic-release
