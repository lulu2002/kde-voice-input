name: kde-voice-input
arch: all
platform: linux
version: ${VERSION}
section: utils
maintainer: lulu2002 <lose9749@gmail.com>
homepage: https://github.com/lulu2002/kde-voice-input
license: MIT
description: |
  KDE Wayland voice dictation popup (Deepgram / Soniox / OpenAI).
  Press a global hotkey, speak, press Enter — the transcript
  lands in your clipboard (or is auto-pasted via ydotool).
contents:
  - src: dictate.py
    dst: /usr/bin/kde-voice-input
    file_info:
      mode: 0755
  - src: kde-voice-input.desktop
    dst: /usr/share/applications/kde-voice-input.desktop
# 舊套件名稱,升級時自動取代
replaces:
  - deepgram-dictate
conflicts:
  - deepgram-dictate
scripts:
  postinstall: packaging/postinstall.sh
overrides:
  rpm:
    depends:
      - python3
      - python3-pyside6
      - python3-websockets
      - wl-clipboard
      - pipewire-utils
    recommends:
      - ydotool
      - playerctl
      - wireplumber
      - opencc-tools
  deb:
    depends:
      - python3
      - python3-pyside6.qtwidgets
      - python3-pyside6.qtnetwork
      - python3-websockets
      - wl-clipboard
      - pipewire-bin
    recommends:
      - ydotool
      - playerctl
      - wireplumber
      - opencc
